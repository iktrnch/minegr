[package]
name = "minegr"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
console = "0.16"
dialoguer = "0.12"
indicatif = "0.18"
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = { version = "1.1", features = ["preserve_order"] }
uuid = { version = "1.0", features = ["serde", "v7"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.27"
